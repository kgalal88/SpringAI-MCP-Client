spring:
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          #model: gemma3:12b
          model: llama3.1:8b
          temperature: 0.8
      model: mxbai-embed-large
    mcp:
      client:
        enabled: true
        type: SYNC
        initialized: true
        sse:
          connections:
            mcp-server:
              url: http://localhost:8081
logging:
  level:
    org.springframework.ai.mcp: DEBUG
    io.modelcontextprotocol: DEBUG